services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong!Passw0rd"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot job: creates the database and Orders table, then exits.
  # `app` won't start until this completes successfully.
  migrate:
    image: mcr.microsoft.com/mssql-tools18:latest
    depends_on:
      mssql:
        condition: service_healthy
    volumes:
      - ./db/init.sql:/init.sql:ro
    entrypoint:
      - /opt/mssql-tools18/bin/sqlcmd
      - -C
      - -S
      - mssql
      - -U
      - sa
      - -P
      - "YourStrong!Passw0rd"
      - -i
      - /init.sql

  app:
    build: .
    environment:
      HTTP_ADDR: ":8080"
      MSSQL_DSN: "sqlserver://sa:YourStrong!Passw0rd@mssql:1433?database=appdb"
      REDIS_ADDR: "redis:6379"
      JWT_SECRET: "dev-secret-change-me"
      ACCESS_TOKEN_TTL: "15m"
      REFRESH_TOKEN_TTL: "168h"
      LOGIN_RATE_LIMIT: "5"
      LOGIN_RATE_WINDOW: "1m"
      AUTH_RATE_LIMIT: "20"
      AUTH_RATE_WINDOW: "1m"
    ports:
      - "8080:8080"
    depends_on:
      mssql:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Dev-only: provisions (or resets the password of) a user directly
  # against the database, since there's no self-serve registration
  # endpoint. Not part of the default `up` graph — run explicitly:
  #   docker compose --profile tools run --rm seed
  #   docker compose --profile tools run --rm seed bob 'Secret123!'
  seed:
    image: golang:1.26-alpine
    working_dir: /src
    volumes:
      - .:/src
    environment:
      MSSQL_DSN: "sqlserver://sa:YourStrong!Passw0rd@mssql:1433?database=appdb"
    depends_on:
      migrate:
        condition: service_completed_successfully
    entrypoint: ["go", "run", "./cmd/seeduser"]
    command: ["admin", "ChangeMe123!"]
    profiles: ["tools"]

volumes:
  mssql-data:
