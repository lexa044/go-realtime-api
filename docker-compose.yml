services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong!Passw0rd"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot job: creates the database and Orders table, then exits.
  # `app` won't start until this completes successfully.
  migrate:
    image: mcr.microsoft.com/mssql-tools18:latest
    depends_on:
      mssql:
        condition: service_healthy
    volumes:
      - ./db/init.sql:/init.sql:ro
    entrypoint:
      - /opt/mssql-tools18/bin/sqlcmd
      - -C
      - -S
      - mssql
      - -U
      - sa
      - -P
      - "YourStrong!Passw0rd"
      - -i
      - /init.sql

  app:
    build: .
    environment:
      HTTP_ADDR: ":8080"
      MSSQL_DSN: "sqlserver://sa:YourStrong!Passw0rd@mssql:1433?database=appdb"
      REDIS_ADDR: "redis:6379"
      JWT_SECRET: "dev-secret-change-me"
    ports:
      - "8080:8080"
    depends_on:
      mssql:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  mssql-data:
